name: StonePSP360 Cloud Toolchain and Executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'core/**'
      - 'tests/**'
      - 'Makefile'
      - 'README.md'
      - 'BUILD_AUDIT.md'
      - '.github/workflows/build-xenon.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Host unit test — Allegrex reset
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/test_allegrex_state.c core/psp/allegrex_state.c -o /tmp/test_allegrex_state
          /tmp/test_allegrex_state
      - name: Host unit test — PSP RAM and aliases
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/test_psp_memory.c core/psp/psp_memory.c -o /tmp/test_psp_memory
          /tmp/test_psp_memory
      - name: Host unit test — core memory integration
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/test_psp_core.c core/psp/psp_core.c core/psp/allegrex_state.c core/psp/psp_memory.c -o /tmp/test_psp_core
          /tmp/test_psp_core
      - name: Host unit test — Allegrex instruction subset
        run: |
          cc -std=c99 -Wall -Wextra -Werror tests/test_allegrex_cpu.c core/psp/allegrex_cpu.c core/psp/allegrex_state.c core/psp/psp_memory.c -o /tmp/test_allegrex_cpu
          /tmp/test_allegrex_cpu
      - name: Compile with cloud libXenon toolchain
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work/StonePSP360" -w /work/StonePSP360 free60/libxenon:latest sh -lc '
            set -eu
            echo "DEVKITXENON=${DEVKITXENON:-<unset>}"
            test -n "${DEVKITXENON:-}"
            test -f "$DEVKITXENON/rules"
            command -v make
            command -v file
            command -v readelf
            make clean
            find source core/psp -type f -name "*.c" -print
            make
            test -s StonePSP360.elf32
            file StonePSP360.elf32
            readelf -h StonePSP360.elf32 | grep -E "Class:.*ELF32"
            readelf -h StonePSP360.elf32 | grep -E "Data:.*big endian"
            readelf -h StonePSP360.elf32 | grep -E "Machine:.*PowerPC"
            cp StonePSP360.elf32 xenon.elf
            sha256sum StonePSP360.elf32 xenon.elf
          '
      - name: Upload Xbox 360 ELF executables
        uses: actions/upload-artifact@v4
        with:
          name: StonePSP360-v8.11b-xbox360-elf
          path: |
            StonePSP360.elf32
            xenon.elf
          if-no-files-found: error
          retention-days: 14
